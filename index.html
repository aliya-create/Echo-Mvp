<!DOCTYPE html>
<html>
<head>
  <title>ECHO MVP</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 40px; }
    button { margin: 10px; padding: 10px 20px; }
  </style>
</head>

<body>

<h1>ECHO</h1>
<p id="question"></p>

<div id="choices"></div>

<button onclick="nextQuestion()">Next</button>

<h2 id="result"></h2>

<script>
const scenarios = [
  {
    question: "You find a lost wallet. What do you do?",
    choices: [
      { text: "Return it", effects: { integrity: 10, empathy: 5, risk: -2, self: -5 } },
      { text: "Keep it", effects: { integrity: -10, empathy: -5, risk: 4, self: 8 } },
      { text: "Donate it", effects: { integrity: 6, empathy: 10, risk: -1, self: -3 } }
    ]
  },
  {
    question: "Your friend lies and asks you to support them.",
    choices: [
      { text: "Support them", effects: { integrity: -8, empathy: 6, risk: 2, self: 4 } },
      { text: "Refuse", effects: { integrity: 10, empathy: -2, risk: 3, self: -3 } },
      { text: "Avoid", effects: { integrity: -2, empathy: -1, risk: -3, self: 5 } }
    ]
  },
  {
    question: "You get extra change at a store.",
    choices: [
      { text: "Return it", effects: { integrity: 8, empathy: 3, risk: -1, self: -4 } },
      { text: "Keep quiet", effects: { integrity: -6, empathy: -2, risk: 2, self: 5 } },
      { text: "Donate later", effects: { integrity: 4, empathy: 6, risk: 0, self: -2 } }
    ]
  }
];

let current = 0;

let traits = {
  integrity: 50,
  empathy: 50,
  risk: 50,
  self: 50
};

function showQuestion() {
  const q = scenarios[current];
  document.getElementById("question").innerText = q.question;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  q.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.text;
    btn.onclick = () => applyChoice(choice.effects);
    choicesDiv.appendChild(btn);
  });
}

function applyChoice(effects) {
  for (let key in effects) {
    traits[key] += effects[key];
    if (traits[key] > 100) traits[key] = 100;
    if (traits[key] < 0) traits[key] = 0;
  }
}

function nextQuestion() {
  current++;

  if (current < scenarios.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("question").innerText = "Your Echo Profile";

  document.getElementById("choices").innerHTML = "";

  document.getElementById("result").innerText =
    "Integrity: " + traits.integrity +
    " | Empathy: " + traits.empathy +
    " | Risk: " + traits.risk +
    " | Self: " + traits.self;
}

showQuestion();
</script>

</body>
</html>
